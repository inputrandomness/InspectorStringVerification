[plugin]

name="Inspector String Verificiaton"
description="*Experimental* This project has not been extensively tested, and features are still being considered.

Provides an inspector plugin for editing strings or StringNames that opens a dropdown with live-filtered input based on a user-created registry list. Shows a check mark when a string is in the list. The current script loads files from a list of uids/paths in directory.txt and registers  constant StringNames, but a user can write their own behavior."
author="Keith M. Jones"
version="0.1"
script="inspector_string_verification.gd"
